# T1 label-blind question set. Generated by scripts/blind_questions.py from the task
# description only (prompt committed before the run); raw reply in t1_blind_raw.json.
context: Below is a social-media comment. Answer questions about the comment itself, not about any post
  it may be replying to.
questions:
  mentions_group: Does the comment reference a race, ethnicity, religion, gender, sexual orientation,
    gender identity, disability, or national origin?
  targets_individual_as_group_member: Does the comment attack or demean a specific person because of their
    membership in such a group?
  targets_whole_group: Does the comment attack, demean, or insult an entire group defined by one of these
    characteristics?
  uses_slur: Does the comment use a slur or derogatory term commonly directed at members of such a group?
  dehumanizing_language: Does the comment compare members of the group to animals, vermin, disease, filth,
    or otherwise dehumanize them?
  calls_for_violence_or_harm: Does the comment call for or wish violence, harm, or exclusion against the
    group or a member of it?
  generalizes_negative_traits: Does the comment claim that all or most members of the group share a negative
    trait or behavior?
  expresses_superiority_or_inferiority: Does the comment state or imply that the group is inferior or
    superior to another group?
  uses_stereotype: Does the comment invoke a common negative stereotype about the group?
  hostile_or_contemptuous_tone: Does the comment use an insulting, hostile, or contemptuous tone toward
    the group or individual?
  denies_rights_or_legitimacy: Does the comment suggest the group does not deserve equal rights, dignity,
    or existence?
  context_is_clearly_non_hateful: Does the comment appear to be quoting, reporting, condemning, or discussing
    hate speech rather than expressing it itself?
  criticism_limited_to_idea_or_policy: Is the comment's criticism aimed only at an idea, policy, or institution
    rather than at a group of people or their identity?
