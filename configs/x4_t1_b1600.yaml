# Extension: B = 1,600 labels, to see where certified automation levels off; otherwise as x4_t1_arms2.
# pre-registered best text baseline). Same task, seed, budgets, shares, policy and reps as
# configs/x4_t1.yaml, so rows pair draw-for-draw with it (resamples are seeded by
# (seed, group, B, rep), independent of the method). Offline: cached answers only.
name: x4_t1_b1600
task: {name: t1, n_train: 3000, n_test: 2000, min_annotations: 3, seed: 0}
policy: {kind: classify, alpha: 0.10, delta: 0.05, cut: 0.5}
budgets: [1600]
fit_shares: [0, 0.10, 0.25, 0.50, 0.75]
reps: 500
seed: 0
min_rest: 100
methods:
  - type: questions_judge
    label: gemma
    answerer:
      questions: configs/questions/t1_v1.yaml
      backend: &gemma {model: google/gemma-4-26b-a4b-it, price_in: 0.0675, price_out: 0.225,
                       offline: true}
    judge:
      label: gemma_judge
      instruction: >
        Is the following social-media comment hate speech? Hate speech attacks or demeans a group,
        or a person because they belong to a group, defined by race, ethnicity, religion, gender,
        sexual orientation, gender identity, disability or national origin.
      backend: *gemma
  - {type: embedding, label: bgeL, model: BAAI/bge-large-en-v1.5, tune: true, heads: [logreg]}
