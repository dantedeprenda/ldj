# X4 on T1, secondary target: selective risk no worse than one human reviewer.
# Offline: every LLM answer must already be cached; an uncached call raises instead of billing.
name: x4_t1_human
task: {name: t1, n_train: 3000, n_test: 2000, min_annotations: 3, seed: 0}
policy: {kind: classify, alpha: 0.21, delta: 0.05, cut: 0.5}   # secondary: no worse than one reviewer (79% right)
budgets: [25, 50, 100, 200, 400, 800]
fit_shares: [0, 0.10, 0.25, 0.50, 0.75]    # f = 0 only for zero-shot scorers
reps: 500
seed: 0
min_rest: 100          # unlabeled pool items the threshold grid is built from, at least
methods:
  - type: questions
    label: gemma
    answerer:
      questions: configs/questions/t1_v1.yaml
      backend: &gemma {model: google/gemma-4-26b-a4b-it, price_in: 0.0675, price_out: 0.225,
                       offline: true}
  - type: judge
    label: gemma_judge
    instruction: >
      Is the following social-media comment hate speech? Hate speech attacks or demeans a group,
      or a person because they belong to a group, defined by race, ethnicity, religion, gender,
      sexual orientation, gender identity, disability or national origin.
    shots: [0]
    backend: *gemma
  - {type: category_prior}
  - {type: tfidf, heads: [logreg]}
  - {type: embedding, label: bge, model: BAAI/bge-base-en-v1.5, heads: [logreg], device: mps}
