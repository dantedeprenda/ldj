# X1 (exploratory): calibrated judge baselines on T2.
# Same task, splits, label draws, seeds and prices as the pre-registered T2 run (configs/t2.yaml).
# Offline: every LLM answer must already be cached; prompts are frozen from configs/t2.yaml.
name: x1_t2
task: {name: t2, split: test, min_positives: 20, cap_records: 2000, test_frac: 0.5, seed: 0}
per_category: true
wss: true
max_usd: 0.0
methods:
  - {type: embedding, label: bgeL, model: BAAI/bge-large-en-v1.5, tune: true, heads: [logreg], device: mps}
  - type: questions
    label: gemma
    answerer:
      questions: configs/questions/t2_v1.yaml
      max_chars: 3000
      backend: &gemma {model: google/gemma-4-26b-a4b-it, price_in: 0.0675, price_out: 0.225, offline: true}
  - type: judge
    label: gemma_judge
    instruction: &t2_instruction >
      You screen records for a systematic review. Given the review's research question and
      eligibility criteria, should this record go on to full-text review?
    shots: [0]
    max_chars: 3000
    backend: *gemma
  - type: judge_platt                      # arm (a)
    judge: &judge {label: gemma_judge, instruction: *t2_instruction, max_chars: 3000, backend: *gemma}
  - type: questions_judge                  # arm (b)
    label: gemma
    answerer: {questions: configs/questions/t2_v1.yaml, max_chars: 3000, backend: *gemma}
    judge: *judge
ks: [5, 10, 25, 50, 100, all]
seeds: [42, 999, 2024, 2025, 3407]
draw: {min_each: 1, min_each_below: 1000000}
prices:
  - {c_fp: 1.83, c_fn: 20.0, volume: 2000}
  - {c_fp: 1.83, c_fn: 100.0, volume: 2000}
threshold_rules: [empirical, ucb]
recall_targets: [0.95]
analysis:
  primary: gemma_features_judge
  baselines: [gemma_features, bgeL_logreg]
  others: [gemma_judge_0shot, gemma_judge_0shot_platt]
  rule_k: 25
  B: 2000
