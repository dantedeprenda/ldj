# W3: features + judge and bge-large on T2. Same task, seed, budgets, shares, policy and
# reps as configs/x4_t2.yaml, so rows pair draw-for-draw with it. Offline: cached answers only.
name: x4_t2_arms2
task: {name: t2, split: test, min_positives: 20, cap_records: 2000, test_frac: 0.5, seed: 0}
per_category: true
policy: {kind: recall, target: 0.95, delta: 0.05}
budgets: [25, 50, 100, 200, 400, 800]
fit_shares: [0, 0.10, 0.25, 0.50, 0.75]
reps: 500
seed: 0
min_rest: 100
methods:
  - type: questions_judge
    label: gemma
    answerer:
      questions: configs/questions/t2_v1.yaml
      max_chars: 3000
      backend: &gemma {model: google/gemma-4-26b-a4b-it, price_in: 0.0675, price_out: 0.225,
                       offline: true}
    judge:
      label: gemma_judge
      instruction: >
        You screen records for a systematic review. Given the review's research question and
        eligibility criteria, should this record go on to full-text review?
      max_chars: 3000
      backend: *gemma
  - {type: embedding, label: bgeL, model: BAAI/bge-large-en-v1.5, tune: true, heads: [logreg]}
