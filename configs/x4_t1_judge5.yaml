# X1 arm (c) (exploratory): a finer judge score, the mean of 5 Gemma answers sampled at
# temperature 1.0 (seeds 0-4), instead of one deterministic verbalized probability in 0.05 steps.
# As the direct judge (f = 0) and inside features + judge. Same task, policy, seed, budgets, shares
# and reps as configs/x4_t1_arms2.yaml, so rows pair draw-for-draw. Answers fetched once with
# scripts/answer.py (cap $2), then offline.
name: x4_t1_judge5
task: {name: t1, n_train: 3000, n_test: 2000, min_annotations: 3, seed: 0}
policy: {kind: classify, alpha: 0.10, delta: 0.05, cut: 0.5}
budgets: [25, 50, 100, 200, 400, 800]
fit_shares: [0, 0.10, 0.25, 0.50, 0.75]
reps: 500
seed: 0
min_rest: 100
max_usd: 2.0
methods:
  - type: judge
    label: gemma_judge
    instruction: &t1_instruction >
      Is the following social-media comment hate speech? Hate speech attacks or demeans a group,
      or a person because they belong to a group, defined by race, ethnicity, religion, gender,
      sexual orientation, gender identity, disability or national origin.
    shots: [0]
    samples: 5
    temperature: 1.0
    backend: &gemma {model: google/gemma-4-26b-a4b-it, price_in: 0.0675, price_out: 0.225,
                     rpm: 600, offline: true}
  - type: questions_judge
    label: gemma_s5
    answerer:
      questions: configs/questions/t1_v1.yaml
      backend: *gemma
    judge:
      label: gemma_judge
      instruction: *t1_instruction
      samples: 5
      temperature: 1.0
      backend: *gemma
