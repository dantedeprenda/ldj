# Exploratory. The two arms X4 lacked on T0: Jev question features (the routing paper's
# strongest method; use checked against the TypeSafe MCA) and bge-large.
# Same task, alpha, seed, budgets, shares and reps as configs/x4_t0.yaml, so rows pair
# draw-for-draw with it. alpha fixed before any T0 result.
name: x4_t0_bonf
task: {name: t0, benchmark: llmrouterbench}
policy: {kind: accept, alpha: 0.1331, delta: 0.05, selection: bonferroni}
budgets: [25, 50, 100, 200, 400, 800]
fit_shares: [0, 0.10, 0.25, 0.50, 0.75]
reps: 500
seed: 0
min_rest: 100
methods:
  - {type: questions, label: jev, answerer: {precomputed: jev}}
  - {type: embedding, label: bgeL, model: BAAI/bge-large-en-v1.5, tune: true, heads: [logreg],
     cache_dir: .cache/embeddings_t0}
